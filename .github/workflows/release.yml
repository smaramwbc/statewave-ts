name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm OIDC trusted publishing needs npm >= 11.5.1; node 20 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install and build
        run: |
          npm install
          npm run build

      # Auth comes from the workflow's OIDC token (id-token: write) via the
      # trusted-publisher config on npmjs.com — no long-lived token to expire.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
